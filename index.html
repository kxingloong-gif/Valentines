<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Valentine's Day, Esther!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="from">From Xing, with 💖</p>
    <h1 id="question">Happy Valentine's Day bae! You prefer me or LV?</h1>
    <p id="subtitle">Pick your answer if you can catch that tiny LV button 👀</p>

    <div class="buttons" id="button-area">
      <button id="yes-btn" class="btn yes" type="button">Me, your hubby!</button>
      <button id="no-btn" class="btn no" type="button" aria-label="I prefer LV button that playfully moves away">I prefer LV!</button>
    </div>

    <section id="response" class="response" hidden>
      <h2>I knew you'd choose me over LV anyday! Love you and Happy Valentines Day &lt;3</h2>
      <p class="hearts">💗 💞 💓 💝 💘</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
