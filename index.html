<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine, Esther?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="from">From Xing, with 💖</p>
    <h1 id="question">Esther, would you be my Valentine?</h1>
    <p id="subtitle">You can choose either option... if you can catch one of them 😘</p>

    <div class="buttons" id="button-area">
      <button id="yes-btn" class="btn yes" type="button">Yes 💘</button>
      <button id="no-btn" class="btn no" type="button" aria-label="No button that playfully moves away">No 🙈</button>
    </div>

    <section id="response" class="response" hidden>
      <h2>Lap you Lap you bae. You clicked Yes!</h2>
      <p class="hearts">💗 💞 💓 💝 💘</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
